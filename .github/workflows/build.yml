name: 打包快门诊断器 (Win + macOS + Linux)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyserial matplotlib numpy pillow

      - name: 打包 Simple 版本
        run: pyinstaller --onefile --windowed --name "快门测量诊断器_Simple" --clean shutter_measurement_simple.py

      - name: 打包 Complex 版本
        run: pyinstaller --onefile --windowed --name "快门测量诊断器_Complex" --clean shutter_measurement_complex.py

      - name: 整理打包文件
        run: |
          mkdir -p release
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp dist/*.exe release/ 2>/dev/null || echo "No Windows exe found"
          else
            cp dist/快门测量诊断器_* release/ 2>/dev/null || echo "No binary found"
          fi

      - name: 上传打包结果
        uses: actions/upload-artifact@v4
        with:
          name: 快门测量诊断器-${{ matrix.os }}
          path: release/
