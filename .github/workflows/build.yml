name: 打包快门诊断器 (Win + Linux + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyserial matplotlib numpy pillow

      - name: 打包程序
        run: |
          pyinstaller --onefile \
                      --windowed \
                      --name "快门测量诊断器" \
                      --clean \
                      main.py

      - name: 整理打包文件
        run: |
          mkdir -p release
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp dist/快门测量诊断器.exe release/
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            cp dist/快门测量诊断器 release/
          else
            cp dist/快门测量诊断器 release/
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 快门测量诊断器-${{ matrix.os }}
          path: release/